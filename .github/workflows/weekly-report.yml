name: Weekly Chef OSS report

on:
  schedule:
    - cron: '15 8 * * 4'
      timezone: America/Los_Angeles
  workflow_dispatch:

concurrency:
  group: weekly-chef-oss-report
  cancel-in-progress: false

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v7

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get -y install imagemagick libmagickwand-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Install oss-stats binstubs
        run: bundle binstubs oss-stats

      - name: Validate report generator
        run: |
          bundle exec rspec
          ./scripts/oss_stats_script.sh run_cookstyle.sh
          ./scripts/oss_stats_script.sh run_shellcheck.sh

      - name: Generate weekly reports
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          ./scripts/run_all_weekly_reports.sh --yes

      - name: Commit and open update weekly PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          report_date="$(date +%F)"
          branch="automation/weekly-report-$report_date"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            existing_pr="$(
              gh pr list --head "$branch" --base main --state all \
                --json state,url --jq '.[0] | "\(.state) \(.url)"'
            )"
            if [[ -n "$existing_pr" ]]; then
              echo "Weekly report branch already has a PR: $existing_pr"
            else
              gh pr create --base main --head "$branch" \
                --title "Weekly Chef OSS reports for $report_date" \
                --body "Automated weekly report generation for $report_date."
            fi
            exit 0
          fi
          git switch -c "$branch"
          git diff --check
          git add -- *_reports/*.md team_slack_reports.md
          if git diff --cached --quiet; then
            echo "No weekly report changes to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --signoff -m "Update weekly Chef OSS reports for $report_date"
          git push origin "HEAD:$branch"
          gh pr create --base main --head "$branch" \
            --title "Weekly Chef OSS reports for $report_date" \
            --body "Automated weekly report generation for $report_date."
